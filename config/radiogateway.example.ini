# RadioSipGateway Linux — пример конфигурации.
# Скопируйте в /etc/radiosipgateway/config.ini и замените значения.
# Не добавляйте реальный пароль в Git.

[SIP]
Server = 192.168.1.10
Port = 5060
Username = radio
Password = CHANGE_ME
LocalPort = 5062
RegistrationRetrySeconds = 10
# Запрашиваемый срок регистрации; обычно 120 с достаточно для Yate.
RegistrationExpirySeconds = 120
# ВКЛЮЧАТЬ ТОЛЬКО ДЛЯ ТЕСТА SIP/SDP/RTP: отвечает тестовой send-only медиасессией, без ALSA и PTT.
AutoAnswerForRtpTest = false

[Audio]
# Имена ALSA PCM. Уточняются командами: arecord -L и aplay -L
CaptureDevice = default
PlaybackDevice = default
SampleRate = 48000
KeepDeviceOpen = true
# false = тестовая тишина (без ALSA); true = двусторонний ALSA/RTP тест.
BridgeEnabled = false

[Transmit]
# cm108 = аппаратный PTT через GPIO/HID CM108; vox = программный VOX; none = PTT отключён.
Mode = cm108
# false — считать любой входящий RTP-кадр активностью (включая тишину); true — включать PTT только по уровню голоса.
VoxEnabled = false
# Путь CM108 HID. Может измениться после переподключения; позже можно закрепить правилом udev.
HidrawPath = /dev/hidraw0
# ВНИМАНИЕ: по умолчанию PTT выключен. Включать только после проверки GPIO и подключения PTT.
PttEnabled = false
# Электрический уровень, включающий передачу: High или Low. Для данной платы с оптопарой и линией PTT, соответствующей AlterFRN-режиму I, — Low.
PttActiveLevel = Low
PttPin = gpio3
CosSource = voldn
# true: установленный бит VOLDN означает занятый канал; соответствует AlterFRN COS=CM108:/dev/hidraw0:VOLDN:N (N = NORMAL).
# Полярность внешнего COS проверяется отдельно от кнопки VOLDN.
CosActiveHigh = true
PttReleaseDelayMs = 700

[VOX]
ThresholdDbfs = -45
ActivationDelayMs = 120
ReleaseDelayMs = 700

[Radio]
SipToRadioTotSeconds = 180
SipToRadioTotLockoutSeconds = 10
# 0 отключает ограничение длительности всего звонка.
GlobalTotSeconds = 0
# Нормализация SIP-речи перед передачей в радио (Stage 42 основного проекта).
SipRadioCompressorEnabled = true
SipRadioCompressorSpeedMs = 120
SipPlaybackGainDb = 6
CourtesyTonesEnabled = true
CourtesyToneToRadioLevelPercent = 45
CourtesyToneToSipLevelPercent = 25
TotWarningToneLevelPercent = 65
IncomingRadioAlertEnabled = true
IncomingRadioAlertLevelPercent = 45
RingbackToneToRadioEnabled = true
RingbackToneLevelPercent = 60
ForwardRadioDtmfToSip = true
AutoCallOnHash = true
ManualDialNumber =
CallsignWavPath = /opt/radiosipgateway/assets/samples/callsign.wav
IncomingWavPath = /opt/radiosipgateway/assets/samples/ringing.wav
IncomingWavEnabled = false
# WAV-образцы поставляются с приложением; воспроизведение ringing/callsign будет подключено отдельным этапом.

[Logging]
Level = Information
